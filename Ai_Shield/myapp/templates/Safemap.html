<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeMap - Find Your Safest Route</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            background-color: #f5f5f5;
        }

        .logo {
            background-color: #22c55e;
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
            padding: 0.75rem 2rem;
            border-radius: 50px;
            margin-bottom: 1rem;
            text-decoration: none;
        }

        .subtitle {
            font-size: 1.25rem;
            color: #333;
            margin-bottom: 2rem;
        }

        .map-container {
            width: 100%;
            max-width: 800px;
            background-color: white;
            padding: 1rem;
            border-radius: 20px;
            border: 4px solid #22c55e;
            position: relative;
            overflow: hidden;
        }

        .map-image {
            width: 100%;
            height: auto;
            border-radius: 12px;
        }

        .try-now-button {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            background-color: #22c55e;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.25rem;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .try-now-button:hover {
            transform: scale(1.05);
        }

        .chatbot {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            cursor: pointer;
        }

        .chatbot-icon {
            background-color: #F472B6;
            border-radius: 50%;
            padding: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chatbot-icon:hover {
            background-color: #f48fb1;
        }

        @media (max-width: 640px) {
            .logo {
                font-size: 2rem;
                padding: 0.5rem 1.5rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .try-now-button {
                font-size: 1rem;
                padding: 0.5rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <a href="#" class="logo">SafeMap</a>
    <h2 class="subtitle">Find Your way Safest Route</h2>
    
    <div class="map-container">
        <img src="https://images.unsplash.com/photo-1569336415962-a4bd9f69cd83?auto=format&fit=crop&q=80&w=800" 
             alt="Map Route" 
             class="map-image">
        <a href="./Safemaptry.html" class="try-now-button">Try Now</a>
    </div>

    <div class="chatbot">
        <a href="./Defendchat.html" style="text-decoration: none;">
        <div class="chatbot-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2A2A2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 8V4H8"/>
                <rect x="3" y="4" width="18" height="12" rx="2" ry="2"/>
                <path d="M2 14h20"/>
                <path d="M7 19h10"/>
                <path d="M12 15v4"/>
                <circle cx="8" cy="9" r="1"/>
                <circle cx="16" cy="9" r="1"/>
            </svg>
        </div>
    </a>
    </div>
</body>
</html>
