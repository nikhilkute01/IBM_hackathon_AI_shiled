<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            background-color: white;
        }

        .header-button {
            background-color: #2FD126;
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .subtitle {
            font-size: 1.25rem;
            margin-bottom: 3rem;
            text-align: center;
        }

        .main-content {
            display: flex;
            gap: 4rem;
            align-items: center;
            max-width: 1200px;
            width: 100%;
            margin-bottom: 4rem;
        }

        .video-container {
            flex: 1;
            aspect-ratio: 16/9;
            border: 2px solid black;
            background-color: #f0f0f0;
            width: 100%;
            max-width: 600px;
        }

        .content-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            font-style: italic;
            margin-bottom: 0.5rem;
        }

        .tagline {
            font-size: 1rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .cta-button {
            background-color: #2FD126;
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.25rem;
        }

        /* Chatbot Styles */
        .chatbot {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 1000;
        }

        .chatbot-icon {
            background-color: #F472B6;
            border-radius: 50%;
            padding: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .chatbot-icon:hover {
            background-color: #f48fb1;
            transform: scale(1.1);
        }

        .chatbot-icon svg {
            width: 32px;
            height: 32px;
            color: #2A2A2A;
        }

        .chat-window {
            position: absolute;
            bottom: calc(100% + 1rem);
            right: 0;
            width: 300px;
            height: 400px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-window.active {
            display: flex;
        }

        .chat-header {
            background: #F472B6;
            color: white;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .chat-header h3 {
            margin: 0;
            flex-grow: 1;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            font-size: 0.9rem;
        }

        .bot-message {
            background: #f0f0f0;
            align-self: flex-start;
            border-bottom-left-radius: 0.25rem;
        }

        .user-message {
            background: #F472B6;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0.25rem;
        }

        .chat-input {
            padding: 1rem;
            border-top: 1px solid #eee;
            display: flex;
            gap: 0.5rem;
        }

        .chat-input input {
            flex-grow: 1;
            padding: 0.5rem 1rem;
            border: 1px solid #ddd;
            border-radius: 1.5rem;
            outline: none;
        }

        .chat-input input:focus {
            border-color: #F472B6;
        }

        .send-button {
            background: #F472B6;
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .send-button:hover {
            background: #f48fb1;
        }
    </style>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <a href="#" class="header-button">Train Yourself</a>
    <p class="subtitle">Train Yourself and analyze Live with Ai</p>

    <div class="main-content">
        <div class="video-container">
            <iframe width="100%" height="100%" src="https://www.youtube.com/embed/eGH70NGZ1po" frameborder="0" allowfullscreen></iframe>
        </div>
        
        <div class="content-right">
            <h1 class="logo">Side Kick</h1>
            <p class="tagline">Ultimate self defence trick</p>
            <a href="{% url 'elbowstrike' %}" class="cta-button">Try it yourself Now</a>
        </div>
    </div>

    <div class="main-content">
        <div class="video-container">
            <iframe width="100%" height="100%" src="https://www.youtube.com/embed/ujppQiig9CU" frameborder="0" allowfullscreen></iframe>
        </div>
        
        <div class="content-right">
            <h1 class="logo">Elbow Strike</h1>
            <p class="tagline">Master self defence trick</p>
            <a href="{% url 'elbowstrike' %}" class="cta-button">Try it yourself Now</a>
        </div>
    </div>

    <div class="chatbot">
        <div class="chat-window">
            <div class="chat-header">
                <i data-lucide="bot" style="width: 24px; height: 24px; color: white;"></i>
                <h3>Training Assistant</h3>
                <button class="close-chat" style="background: none; border: none; cursor: pointer;">
                    <i data-lucide="x" style="width: 24px; height: 24px; color: white;"></i>
                </button>
            </div>
            <div class="chat-messages">
                <div class="message bot-message">
                    Hello! I'm your training assistant. How can I help you today?
                </div>
            </div>
            <div class="chat-input">
                <input type="text" placeholder="Type your message..." id="chat-input">
                <button class="send-button">
                    <i data-lucide="send" style="width: 18px; height: 18px;"></i>
                </button>
            </div>
        </div>
        <div class="chatbot">
            <div class="chatbot-icon">
                <a href="./Defendchat.html" style="text-decoration: none;"> <i data-lucide="bot" style="width: 32px; height: 32px; color: #2A2A2A;"></i></a>
               
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Chatbot functionality
        document.addEventListener('DOMContentLoaded', function() {
        
            // Toggle chat window
           

            
            // Send message function
            function sendMessage() {
                const message = chatInput.value.trim();
                if (message) {
                    // Add user message
                    const userMessageDiv = document.createElement('div');
                    userMessageDiv.className = 'message user-message';
                    userMessageDiv.textContent = message;
                    chatMessages.appendChild(userMessageDiv);

                    // Clear input
                    chatInput.value = '';

                    // Simulate bot response (you can replace this with actual AI response)
                   
                }
            }

            // Send message on button click
            sendButton.addEventListener('click', sendMessage);

            // Send message on Enter key
            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
        });
    </script>
</body>
</html>
