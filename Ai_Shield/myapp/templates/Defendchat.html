<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DefendChat AI</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            margin: 20px 0;
        }

        .logo {
            background-color: #00c853;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            margin: 15px 0;
            color: #333;
            font-size: 18px;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            background: white;
            border-radius: 25px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            border: 3px solid #00c853;
        }

        .chat-image {
            width: 100%;
            height: 300px;
            background: linear-gradient(45deg, #6a1b9a, #9c27b0);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .chat-interface {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 70%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-messages {
            flex: 1;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 15px;
            max-width: 70%;
            align-self: flex-end;
        }

        .try-now-button {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background-color: #00c853;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 200, 83, 0.3);
        }

        /* New Chatbot Styles */
        .chatbot {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            cursor: pointer;
            z-index: 1000;
        }

        .chatbot-icon {
            background-color: #F472B6;
            border-radius: 50%;
            padding: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chatbot-icon:hover {
            background-color: #f48fb1;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">DefendChat AI</div>
    </div>
    
    <div class="subtitle">Talk with ai to know anything about Self defense</div>
    
    <div class="chat-container">
        <div class="chat-image">
            <div class="chat-interface">
                <div class="chat-header">
                    <span style="color: white;">Chat AI</span>
                </div>
                <div class="chat-messages">
                    <div class="message">How can I help you with self defense?</div>
                </div>
            </div>
        </div>
        
        <a href="{% url 'defendchat' %}" class="try-now-button">Try Now</a>
    </div>

    <!-- Chat Bot -->
    <div class="chatbot">
        <div class="chatbot-icon">
            <a href="{% url 'defendchat' %}" style="text-decoration: none;"> <i data-lucide="bot" style="width: 32px; height: 32px; color: #2A2A2A;"></i></a>
           
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
